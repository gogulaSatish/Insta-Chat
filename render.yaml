services:
  - type: web
    env: node
    region: ohio
    plan: free
    # Install root deps, then install frontend deps including devDependencies so Vite is available,
    # then build the frontend.
    buildCommand: npm install && npm install --prefix frontend --include=dev && npm run build --prefix frontend
    startCommand: node backend/server.js
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGO_DB_URI
        scope: project
      - key: JWT_SECRET
        scope: project
